<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Netscope — Packet Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0b0d14;
    --surface:  #11141f;
    --surface2: #181c2b;
    --border:   #242840;
    --border2:  #2e3450;
    --amber:    #f0a500;
    --amber-dim:#7a5300;
    --tcp:      #38bdf8;
    --udp:      #4ade80;
    --icmp:     #fb7185;
    --other:    #94a3b8;
    --text:     #dde3f0;
    --muted:    #5a6080;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
  }

  .logo-text {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--amber);
    text-transform: uppercase;
  }

  .logo-sub {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .status-badge.live { color: var(--udp); }

  .pulse {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  .status-badge.live .pulse {
    background: var(--udp);
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }

  .controls label {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .controls input {
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 0.45rem 0.75rem;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text);
    width: 160px;
    outline: none;
    transition: border-color 0.2s;
  }

  .controls input:focus { border-color: var(--amber); }
  .controls input::placeholder { color: var(--muted); }

  .btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 1rem;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .btn-start {
    background: var(--amber);
    border-color: var(--amber);
    color: #0b0d14;
  }
  .btn-start:hover { filter: brightness(1.15); }
  .btn-start:disabled { opacity: 0.35; cursor: default; }

  .btn-stop {
    background: transparent;
    border-color: var(--border2);
    color: var(--muted);
  }
  .btn-stop:hover:not(:disabled) { border-color: var(--icmp); color: var(--icmp); }
  .btn-stop:disabled { opacity: 0.3; cursor: default; }

  .btn-file {
    background: transparent;
    border-color: var(--border2);
    color: var(--muted);
    margin-left: auto;
  }
  .btn-file:hover { border-color: var(--tcp); color: var(--tcp); }

  /* ── Stats ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat-card {
    background: var(--surface);
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    transition: color 0.3s;
  }

  .stat-card.tcp  .stat-value { color: var(--tcp);  }
  .stat-card.udp  .stat-value { color: var(--udp);  }
  .stat-card.icmp .stat-value { color: var(--icmp); }

  /* ── Log ── */
  .log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .log-title {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .btn-clear {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    transition: color 0.15s;
  }
  .btn-clear:hover { color: var(--text); }

  .log-stream {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0;
    font-family: var(--mono);
    font-size: 0.78rem;
    min-height: 0;
    height: calc(100vh - 320px);
  }

  .log-stream::-webkit-scrollbar { width: 4px; }
  .log-stream::-webkit-scrollbar-track { background: transparent; }
  .log-stream::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .log-entry {
    display: grid;
    grid-template-columns: 60px 1fr 110px 80px 80px;
    gap: 0;
    padding: 0.28rem 2rem;
    align-items: center;
    border-bottom: 1px solid transparent;
    animation: slideIn 0.18s ease-out;
    transition: background 0.1s;
}

  .log-count {
    color: var(--amber);
    font-family: var(--mono);
    font-size: 0.75rem;
    text-align: center;
}

  .log-entry:hover { background: var(--surface2); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .log-num {
    color: var(--muted);
    font-size: 0.7rem;
  }

  .proto-badge {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-align: center;
  }

  .proto-tcp  { background: rgba(56,189,248,0.12); color: var(--tcp);  }
  .proto-udp  { background: rgba(74,222,128,0.12); color: var(--udp);  }
  .proto-icmp { background: rgba(251,113,133,0.12); color: var(--icmp); }
  .proto-other{ background: rgba(148,163,184,0.1);  color: var(--other);}

  .log-ports {
    color: var(--text);
    font-size: 0.75rem;
    padding-left: 1rem;
  }

  .log-ports .arrow { color: var(--muted); margin: 0 0.3rem; }

  .log-len {
    color: var(--muted);
    font-size: 0.7rem;
    text-align: right;
  }

  .threat-safe {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    background: rgba(74,222,128,0.12);
    color: var(--udp);
}

.threat-suspicious {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    background: rgba(251,113,133,0.15);
    color: var(--icmp);
}

.threat-unknown {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 3px;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    background: rgba(148,163,184,0.1);
    color: var(--other);
}

  /* ── Status bar ── */
  .statusbar {
    padding: 0.4rem 2rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .statusbar .ws-status { display: flex; align-items: center; gap: 0.4rem; }
  .ws-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .ws-dot.connected { background: var(--udp); }

  /* ── Empty state ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    gap: 0.75rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.8rem;
  }

  .empty-grid {
    width: 80px; height: 60px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 2px;
    margin-bottom: 0.5rem;
  }

  .empty-grid span {
    border-radius: 1px;
    background: var(--surface2);
    animation: gridPulse 2s ease-in-out infinite;
  }

  .empty-grid span:nth-child(3n) { animation-delay: 0.3s; }
  .empty-grid span:nth-child(5n) { animation-delay: 0.7s; }
  .empty-grid span:nth-child(7n) { animation-delay: 1.1s; }

  @keyframes gridPulse {
    0%, 100% { opacity: 0.2; }
    50%       { opacity: 0.6; }
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-dot"></div>
    <div>
      <div class="logo-text">Netscope</div>
      <div class="logo-sub">Packet Analyzer</div>
    </div>
  </div>
  <div class="status-badge" id="statusBadge">
    <div class="pulse"></div>
    <span id="statusText">Idle</span>
  </div>
</header>

<!-- Controls -->
<div class="controls">
  <label>Interface</label>
  <input type="text" id="ifaceInput" placeholder="eth0 (blank = auto)" />
  <button class="btn btn-start" id="btnStart" onclick="startCapture()">▶ Start</button>
  <button class="btn btn-stop"  id="btnStop"  onclick="stopCapture()" disabled>■ Stop</button>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Total</div>
    <div class="stat-value" id="sTotal">0</div>
  </div>
  <div class="stat-card tcp">
    <div class="stat-label">TCP</div>
    <div class="stat-value" id="sTcp">0</div>
  </div>
  <div class="stat-card udp">
    <div class="stat-label">UDP</div>
    <div class="stat-value" id="sUdp">0</div>
  </div>
  <div class="stat-card icmp">
    <div class="stat-label">ICMP</div>
    <div class="stat-value" id="sIcmp">0</div>
  </div>
</div>

<!-- Log -->
<div class="log-header">
  <span class="log-title">Live Packet Stream</span>
  <button class="btn-clear" onclick="clearLog()">Clear</button>
</div>

<div class="log-stream" id="logStream">
  <div class="empty-state" id="emptyState">
    <div class="empty-grid">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <span>Start capture to see packets</span>
  </div>
</div>

<!-- Status bar -->
<div class="statusbar">
  <div class="ws-status">
    <div class="ws-dot" id="wsDot"></div>
    <span id="wsText">Connecting...</span>
  </div>
  <span id="statusMsg"></span>
</div>

<script>
  let ws, capturing = false;
  const flows = new Map();

  function connect() {
    ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
        document.getElementById('wsDot').classList.add('connected');
        document.getElementById('wsText').textContent = 'Connected';
    };

    ws.onclose = () => {
        document.getElementById('wsDot').classList.remove('connected');
        document.getElementById('wsText').textContent = 'Disconnected — retrying...';
        setTimeout(connect, 2000);
    };

    ws.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }
        handle(msg);
    };
}

  function handle(msg) {
    switch (msg.type) {
        case 'packet':
            updateFlow(msg);
            document.getElementById('sTotal').textContent = msg.num;
            break;
        case 'stats':
            document.getElementById('sTotal').textContent = msg.total;
            document.getElementById('sTcp').textContent   = msg.tcp;
            document.getElementById('sUdp').textContent   = msg.udp;
            document.getElementById('sIcmp').textContent  = msg.icmp;
            break;
        case 'status':
            document.getElementById('statusMsg').textContent = msg.msg;
            break;
        case 'stopped':
            setCapturing(false);
            document.getElementById('statusMsg').textContent = 'Capture stopped';
            break;
    }
}

  function updateFlow(p) {
    const proto  = (p.proto || 'OTHER').toUpperCase();
    const src    = p.src !== undefined ? p.src : '—';
    const dst    = p.dst !== undefined ? p.dst : '—';
    const threat = p.threat || 'UNKNOWN';
    const key    = `${proto}:${src}→${dst}`;

    if (flows.has(key)) {
        const f = flows.get(key);
        f.count++;
        f.bytes += p.len;
    } else {
        flows.set(key, { proto, src, dst, threat, count: 1, bytes: p.len });
    }

    const tcpEl  = document.getElementById('sTcp');
    const udpEl  = document.getElementById('sUdp');
    const icmpEl = document.getElementById('sIcmp');
    if (proto === 'TCP')  tcpEl.textContent  = parseInt(tcpEl.textContent)  + 1;
    if (proto === 'UDP')  udpEl.textContent  = parseInt(udpEl.textContent)  + 1;
    if (proto === 'ICMP') icmpEl.textContent = parseInt(icmpEl.textContent) + 1;

    renderFlows();
}

  function renderFlows() {
    const stream = document.getElementById('logStream');
    const empty  = document.getElementById('emptyState');
    if (empty) empty.remove();

    const sorted = [...flows.values()].sort((a, b) => b.count - a.count);

    stream.innerHTML = '';
    sorted.forEach(f => {
        const badgeClass = { TCP:'proto-tcp', UDP:'proto-udp', ICMP:'proto-icmp' }[f.proto] || 'proto-other';
        const threatClass = {
            'SAFE':       'threat-safe',
            'SUSPICIOUS': 'threat-suspicious',
            'UNKNOWN':    'threat-unknown'
        }[f.threat] || 'threat-unknown';

        const row = document.createElement('div');
        row.className = 'log-entry';
        row.innerHTML = `
            <span class="proto-badge ${badgeClass}">${f.proto}</span>
            <span class="log-ports">${f.src}<span class="arrow"> → </span>${f.dst}</span>
            <span class="${threatClass}">${f.threat}</span>
            <span class="log-count">×${f.count}</span>
            <span class="log-len">${f.bytes} B</span>
        `;
        stream.appendChild(row);
    });
  }

  function setCapturing(on) {
    capturing = on;
    const badge = document.getElementById('statusBadge');
    badge.className = 'status-badge' + (on ? ' live' : '');
    document.getElementById('statusText').textContent = on ? 'Capturing' : 'Idle';
    document.getElementById('btnStart').disabled = on;
    document.getElementById('btnStop').disabled  = !on;
}

  function startCapture() {
    if (!ws || ws.readyState !== 1) return;
    const device = document.getElementById('ifaceInput').value.trim() || null;
    ws.send(JSON.stringify({ action: 'start', device }));

    ['sTotal','sTcp','sUdp','sIcmp'].forEach(id =>
        document.getElementById(id).textContent = '0'
    );
    flows.clear();

    setCapturing(true);
}

  function stopCapture() {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ action: 'stop' }));
}

  function clearLog() {
    flows.clear();
    document.getElementById('logStream').innerHTML = '';
}

  connect();
</script>
</body>
</html>
